<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{% block title %}Gestão Social Municipal{% endblock %}</title>
  <style>
    :root{--navy:#142d4c;--blue:#225cb5;--green:#087d67;--ink:#1d314b;--muted:#64748b;--line:#dce4ee;--canvas:#f4f7fb;--white:#fff;--danger:#a32939}
    *{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:24px}body{margin:0;background:var(--canvas);color:var(--ink);font:15px/1.6 Inter,"Source Sans 3",system-ui,sans-serif}a{color:var(--blue)}button,input,select,textarea{font:inherit}button,a,input,select,textarea{outline-offset:4px}:focus-visible{outline:3px solid #54aeed}button{cursor:pointer}.skip-link{position:fixed;top:-80px;left:20px;z-index:10;padding:12px;background:white}.skip-link:focus{top:10px}.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}.sidebar{background:var(--navy);color:white;display:flex;flex-direction:column;padding:30px 20px;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none;line-height:1.3}.brand-mark{display:grid;place-items:center;width:40px;height:44px;border-radius:12px 12px 18px 18px;background:#1e7e83;color:white;font-size:21px;font-weight:700}.brand strong{display:block;font-size:17px}.brand small{color:#b2c5dd;font-size:12px}.sidebar nav{display:grid;gap:7px;margin-top:42px}.sidebar nav a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:8px;text-decoration:none;color:#d6e1f0;font-weight:500}.sidebar nav a:hover,.sidebar nav a:focus{background:#233f60;color:white}.sidebar nav a:first-child{background:#26486e;color:white}.nav-dot{width:7px;height:7px;border-radius:2px;background:#68c7ba;flex:none}.sidebar-bottom{margin-top:auto;padding:24px 10px 0;border-top:1px solid #34506e;color:#b6c9e1;font-size:12px}.sidebar-bottom strong{color:white;font-weight:600}.workspace{min-width:0}.topbar{min-height:82px;background:white;border-bottom:1px solid var(--line);padding:18px 40px;display:flex;justify-content:space-between;align-items:center;gap:20px}.municipality{font-size:13px;color:var(--muted)}.municipality strong{display:block;color:var(--ink);font-size:14px}.account{display:flex;align-items:center;gap:14px}.account-info{text-align:right;font-size:12px;color:var(--muted)}.account-info strong{display:block;font-size:13px;color:var(--ink)}.account form{margin:0}.avatar{width:36px;height:36px;display:grid;place-items:center;background:#edf2fa;color:var(--blue);font-weight:700;border-radius:50%}main{max-width:1420px;padding:34px 40px 50px;margin:auto}.page-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:28px}h1,h2,h3,p{margin:0}h1{font-size:29px;letter-spacing:-.7px;line-height:1.3;font-weight:700}h2{font-size:18px;line-height:1.4;letter-spacing:-.2px}h3{font-size:15px}p{color:var(--muted)}.page-heading p{margin-top:7px}.button,button{border:1px solid transparent;border-radius:7px;background:var(--blue);color:white;display:inline-flex;justify-content:center;align-items:center;min-height:42px;padding:9px 17px;font-weight:600;text-decoration:none;white-space:nowrap}.button:hover,button:hover{background:#164d9c}.button.secondary,button.secondary{border-color:var(--line);background:white;color:var(--ink)}.button.secondary:hover,button.secondary:hover{background:#eff4fa}.summary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-bottom:28px}.summary{background:white;border:1px solid var(--line);border-radius:12px;padding:22px 24px}.summary-label{font-size:13px;color:var(--muted)}.summary-value{font-size:27px;font-weight:700;line-height:1.4;margin:8px 0 3px;letter-spacing:-.6px}.summary-note{font-size:12px;color:var(--muted)}.summary-accent{border-top:3px solid var(--green)}.panel{border:1px solid var(--line);border-radius:12px;background:white;overflow:hidden;margin-bottom:24px}.panel-head{padding:22px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:20px}.panel-head p{font-size:13px;margin-top:3px}.panel-body{padding:24px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.field label{display:block;font-size:13px;font-weight:600;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;min-height:45px;border:1px solid #bdcbdc;background:white;color:var(--ink);border-radius:7px;padding:10px 12px}.field input:hover,.field select:hover{border-color:#7894b4}.field input:focus,.field select:focus{border-color:var(--blue)}.field .helptext{display:block;font-size:12px;color:var(--muted);margin-top:6px}.field .errorlist,.form-errors{color:var(--danger);font-size:13px;margin:6px 0;padding-left:20px}.form-actions{display:flex;align-items:center;justify-content:flex-end;padding-top:22px;gap:14px}.form-actions p{font-size:12px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left}th{background:#f8fafc;color:var(--muted);font-size:12px;font-weight:600;padding:12px 24px;border-bottom:1px solid var(--line)}td{padding:17px 24px;border-bottom:1px solid #edf1f6;font-size:13px;vertical-align:top}tbody tr:last-child td{border-bottom:0}td:first-child{white-space:nowrap;color:var(--muted)}.empty-state{padding:46px 24px;text-align:center}.empty-state h3{margin-bottom:6px}.empty-state p{font-size:13px}.empty-state .button{margin-top:20px}.table-note{padding:13px 24px;background:#fafbfd;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}.footer{display:flex;justify-content:space-between;gap:18px;padding-top:10px;font-size:12px;color:var(--muted)}.footer strong{font-weight:700;color:var(--navy)}.login-page{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr;background:white}.login-intro{background:var(--navy);color:white;padding:48px clamp(32px,6vw,100px);display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}.login-copy{padding:70px 0;max-width:470px;position:relative}.login-copy h1{font-size:clamp(32px,3.4vw,48px);line-height:1.18;letter-spacing:-1.3px}.login-copy p{color:#c3d3e5;font-size:17px;line-height:1.8;margin-top:24px}.login-rule{width:54px;height:4px;background:#53bea5;margin-bottom:26px}.login-intro .brand{align-self:flex-start}.login-meta{font-size:12px;color:#a8bfd9}.login-form-area{padding:48px;display:flex;flex-direction:column;justify-content:center;align-items:center}.login-card{width:100%;max-width:390px}.login-card h2{font-size:27px;letter-spacing:-.7px}.login-card>p{margin:9px 0 30px}.login-card .field{margin-bottom:20px}.login-card button{width:100%;margin-top:5px;min-height:47px}.login-card .form-errors{background:#fff0f1;border:1px solid #f0cbd0;border-radius:7px;padding:12px 15px;list-style:none;margin:0 0 20px}.login-foot{font-size:12px;text-align:center;margin-top:25px;color:var(--muted)}.login-signature{margin-top:55px;font-size:12px;color:var(--muted)}.login-signature strong{color:var(--navy)}
    .vexo-logo{width:66px;height:24px;object-fit:contain;vertical-align:middle;margin-left:5px}.sidebar-bottom .vexo-logo{filter:brightness(0) invert(1)}.notice{background:#e9f6ef;border:1px solid #b8dfcb;color:#176044;padding:13px 18px;border-radius:8px;margin-bottom:22px}.search-form{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}.search-form .field{flex:1;min-width:200px}.search-form>a{font-size:13px;padding-bottom:10px}
    @media(min-width:1200px){.forms-layout{display:grid;grid-template-columns:1fr 1fr;gap:24px}.forms-layout .panel:first-child{grid-column:1/-1}.forms-layout .panel{margin-bottom:0}.forms-layout{margin-bottom:24px}}
    @media(max-width:1000px){.app{grid-template-columns:200px minmax(0,1fr)}.sidebar{padding:25px 14px}.topbar{padding:18px 24px}main{padding:28px 24px}.summary{padding:18px}.summary-grid{gap:12px}.summary-value{font-size:23px}}
    @media(max-width:760px){.app{display:block}.sidebar{height:auto;position:static;padding:18px 20px}.sidebar nav{display:flex;flex-wrap:wrap;margin-top:20px;gap:4px}.sidebar nav a{padding:8px 12px;font-size:13px}.sidebar-bottom{display:none}.topbar{min-height:70px;padding:15px 20px}.account-info{display:none}.avatar{display:none}main{padding:25px 18px 35px}h1{font-size:25px}.page-heading{gap:14px;flex-wrap:wrap}.summary-grid{grid-template-columns:1fr}.summary{padding:17px 20px;display:grid;grid-template-columns:1fr auto;column-gap:15px;align-items:center}.summary-value{grid-column:2;grid-row:1/3;margin:0;font-size:22px}.summary-note{grid-column:1}.form-grid{grid-template-columns:1fr}.panel-head,.panel-body{padding:20px}.form-actions{align-items:stretch;flex-direction:column-reverse}.form-actions button{width:100%}th,td{padding:13px 20px}.footer{flex-direction:column;gap:4px}.login-page{display:block}.login-intro{padding:25px}.login-copy{padding:36px 0 12px}.login-copy h1{font-size:30px;max-width:430px}.login-copy p{font-size:14px;margin-top:15px}.login-meta{display:none}.login-form-area{padding:35px 25px}.login-signature{margin-top:30px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
  </style>
</head>
<body>
<a class="skip-link" href="#conteudo">Ir para o conteúdo</a>
{% block layout %}{% endblock %}
</body>
</html>
