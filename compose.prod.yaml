services:
  social-db:
    restart: unless-stopped
  social-web:
    image: ${SOCIAL_WEB_IMAGE:-social-prefeituras-social-web:latest}
    restart: unless-stopped
    read_only: true
    cpus: 0.65
    mem_limit: 384m
    pids_limit: 80
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
    tmpfs: ["/tmp:size=128m,mode=1777"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
