{% extends "documentos/base.html" %}
{% block acervo %}
<nav class="doc-retorno" aria-label="Navegação do documento"><a href="{% url 'documentos:detalhe' versao.documento_id %}">Voltar ao documento</a></nav>
<header class="doc-header"><div><h1>Conferir documento</h1><p>{{ versao.nome }} · Versão {{ versao.sequencia }}</p></div></header>
<form class="doc-painel" action="{% url 'documentos:conferir' versao.pk %}" method="post">{% csrf_token %}
<div class="doc-topo"><h2>Resultado da conferência</h2></div><div class="doc-interno">{{ form.non_field_errors }}<div class="doc-campos">{% for campo in form %}<div>{{ campo.as_field_group }}</div>{% endfor %}</div><div class="doc-acoes doc-rodape"><button>Registrar conferência</button></div></div></form>
{% endblock %}
