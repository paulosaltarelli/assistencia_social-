name: social-prefeituras
services:
  social-db:
    build:
      context: ./infra
      dockerfile: Dockerfile.db
    environment:
      POSTGRES_DB: social
      POSTGRES_PASSWORD: ${SOCIAL_ADMIN_PASSWORD:?}
      SOCIAL_DB_PASSWORD: ${SOCIAL_DB_PASSWORD:?}
    volumes:
      - dados:/var/lib/postgresql/data
    networks: [privada]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "social"]
      interval: 10s
      timeout: 3s
      retries: 6
  social-web:
    build: .
    environment:
      SOCIAL_DB_PASSWORD: ${SOCIAL_DB_PASSWORD:?}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?}
      SOCIAL_HOSTS: ${SOCIAL_HOSTS:-localhost,127.0.0.1}
    ports: ["127.0.0.1:18081:8000"]
    networks: [privada]
    depends_on:
      social-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  privada: {}
volumes:
  dados: {}
