name: social-prefeituras
services:
  social-db:
    build:
      context: ./infra
      dockerfile: Dockerfile.db
    environment:
      POSTGRES_DB: social
      POSTGRES_PASSWORD: ${SOCIAL_ADMIN_PASSWORD:?}
      SOCIAL_DB_PASSWORD: ${SOCIAL_DB_PASSWORD:?}
    volumes:
      - dados:/var/lib/postgresql/data
    networks: [privada]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "social"]
      interval: 10s
      timeout: 3s
      retries: 6
  social-web:
    build: .
    environment:
      SOCIAL_DB_PASSWORD: ${SOCIAL_DB_PASSWORD:?}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?}
      SOCIAL_DB_NAME: ${SOCIAL_DB_NAME:-social}
      SOCIAL_HOSTS: ${SOCIAL_HOSTS:-localhost,127.0.0.1}
      SOCIAL_MUNICIPIO_PUBLICO: ${SOCIAL_MUNICIPIO_PUBLICO:-}
      SOCIAL_MUNICIPIOS_GEOGRAFICOS: ${SOCIAL_MUNICIPIOS_GEOGRAFICOS:-}
      SOCIAL_HOMOLOGACAO: ${SOCIAL_HOMOLOGACAO:-0}
      SOCIAL_CHAVE_INDICE: ${SOCIAL_CHAVE_INDICE:-}
      SOCIAL_CLAMAV_HOST: ${SOCIAL_CLAMAV_HOST:-social-antivirus}
      SOCIAL_CLAMAV_PORT: ${SOCIAL_CLAMAV_PORT:-3310}
      CONTAS_SMTP_ATIVO: ${CONTAS_SMTP_ATIVO:-0}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-1}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-0}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-}
    ports: ["127.0.0.1:18081:8000"]
    networks: [privada]
    depends_on:
      social-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  privada: {}
volumes:
  dados: {}
