Listen 2.25.146.67:8447
<VirtualHost 2.25.146.67:8447>
    ServerName 2.25.146.67
    SSLEngine on
    SSLCertificateFile /var/lib/social-prefeituras/tls/config/live/social-prefeituras-ip/fullchain.pem
    SSLCertificateKeyFile /var/lib/social-prefeituras/tls/config/live/social-prefeituras-ip/privkey.pem
    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass / http://127.0.0.1:18081/
    ProxyPassReverse / http://127.0.0.1:18081/
    ErrorLog ${APACHE_LOG_DIR}/social-prefeituras-error.log
    CustomLog ${APACHE_LOG_DIR}/social-prefeituras-access.log "%t %m %>s %D"
</VirtualHost>
