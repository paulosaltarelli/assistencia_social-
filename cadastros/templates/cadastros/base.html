{% extends "app_shell.html" %}
{% block conteudo %}
<style>
.cd-stack{display:grid;gap:20px}.cd-toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}.cd-card{background:white;border:1px solid #d8e2ed;border-radius:12px;padding:24px}.cd-actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.cd-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:20px}.cd-field label{display:block;font-weight:600;margin:0 0 6px}.cd-field input,.cd-field select,.cd-field textarea{width:100%;max-width:100%;padding:11px;border:1px solid #9caec2;border-radius:6px;font:inherit;color:#18314c;background:white}.cd-field input[type=checkbox]{width:auto}.cd-help{color:#52657c;font-size:.875rem;display:block;margin-top:6px}.cd-error{color:#9e263b}.cd-table{width:100%;border-collapse:collapse;text-align:left}.cd-table th,.cd-table td{border-bottom:1px solid #e1e7f0;padding:12px;vertical-align:top}.cd-scroll{overflow:auto}.cd-info{background:#edf5fb;padding:14px;border-left:4px solid #2262a1}.cd-pagination{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:16px}.cd-dados{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px}.cd-dados dt{font-size:.875rem;color:#52657c}.cd-dados dd{margin:3px 0 0;font-weight:500}.cd-tabs{display:flex;flex-wrap:wrap;gap:15px}.cd-card h2{margin-bottom:14px}.cd-empty{color:#52657c;padding:15px 0}.cd-button{display:inline-block;border:1px solid #225cb5;border-radius:7px;padding:10px 16px;background:#225cb5;color:white;text-decoration:none;font:inherit;cursor:pointer}.cd-secondary{background:white;color:#225cb5}.cd-muted{font-size:.875rem;color:#52657c}.cd-nowrap{white-space:nowrap}.cd-hidden{display:none} @media(max-width:600px){.cd-card{padding:16px}.cd-dados{grid-template-columns:1fr}.cd-toolbar{align-items:stretch}}
</style>
<div class="cd-stack">
<div class="cd-toolbar"><h1>{{ titulo }}</h1><div class="cd-actions"><a href="{% url 'cadastros:inicio' %}">Cadastro geral</a><a href="{% url 'cadastros:familias' %}">Famílias</a><a href="{% url 'cadastros:atendimentos' %}">Atendimentos</a></div></div>
{% if messages %}{% for message in messages %}<div class="cd-info" role="status">{{ message }}</div>{% endfor %}{% endif %}
{% block cadastro_conteudo %}{% endblock %}
</div>
{% endblock %}
