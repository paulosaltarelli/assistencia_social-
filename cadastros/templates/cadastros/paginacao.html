{% if pagina.paginator.count %}<nav class="cd-pagination" aria-label="{{ rotulo|default:'Paginação de resultados' }}"><span>{{ pagina.paginator.count }} registro{{ pagina.paginator.count|pluralize }} · Página {{ pagina.number }} de {{ pagina.paginator.num_pages }}</span><div class="cd-actions">{% if pagina.has_previous %}<a class="cd-page-button" href="{% querystring page=pagina.previous_page_number %}">Anterior</a>{% endif %}{% if pagina.has_next %}<a class="cd-page-button" href="{% querystring page=pagina.next_page_number %}">Próxima</a>{% endif %}</div></nav>{% endif %}
